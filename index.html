    <script>
      // Filter unhandled errors and rejections caused by third-party browser extensions (e.g. MetaMask)
      window.addEventListener('error', function (e) {
        if (
          (e.filename && (e.filename.indexOf('chrome-extension://') !== -1 || e.filename.indexOf('moz-extension://') !== -1)) ||
          (e.message && e.message.indexOf('MetaMask') !== -1)
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
          return true;
        }
      }, true);
      window.addEventListener('unhandledrejection', function (e) {
        var reason = e.reason;
        var msg = typeof reason === 'string' ? reason : (reason && reason.message ? reason.message : '');
        var stack = reason && reason.stack ? reason.stack : '';
        if (
          msg.indexOf('MetaMask') !== -1 ||
          stack.indexOf('chrome-extension://') !== -1 ||
          stack.indexOf('moz-extension://') !== -1
        ) {
          e.stopImmediatePropagation();
          e.preventDefault();
        }
      }, true);
    </script>
