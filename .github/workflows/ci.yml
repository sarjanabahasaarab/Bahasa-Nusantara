name: NUSANTARA Continuous Integration

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master

# P0: Least-Privilege Permissions at workflow root
permissions:
  contents: read

# P1: Concurrency Control (Batalkan alur lama pada PR, jangan batalkan pada push main)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. STATIC CHECKS & LINTING
  # ============================================================================
  static-checks:
    name: NUSANTARA / Pemeriksaan Statis
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi Proyek (Reproducible)
        run: npm ci

      - name: Validasi Konfigurasi & Tipe Data (Lint / Typecheck)
        run: |
          npm run lint

  # ============================================================================
  # 2. AUTOMATED TEST SUITE (PHASE 1 - 24)
  # ============================================================================
  test-suite:
    name: NUSANTARA / Pengujian Otomatis (${{ matrix.os }})
    needs: static-checks
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Verifikasi Node.js 22 LTS & Native node:sqlite (DatabaseSync)
        run: |
          node -v
          node -e "const s = process.getBuiltinModule('node:sqlite'); if (!s || typeof s.DatabaseSync !== 'function') { console.error('[GALAT] node:sqlite DatabaseSync tidak tersedia pada ' + process.version); process.exit(1); } console.log('[OK] node:sqlite DatabaseSync tersedia pada', process.platform, process.arch, process.version);"

      - name: Pasang Dependensi
        run: npm ci

      - name: Uji Khusus Phase 29 SQLite Native & Browser Fallback Lintas Platform
        shell: bash
        run: |
          npm run test:database-v29
          npm run test:database-browser-v29

      - name: Jalankan Rangkaian Uji Lengkap (Phase 1–50)
        run: npm test

  # ============================================================================
  # 3. QUALITY GATE NUSANTARA
  # ============================================================================
  quality-gate:
    name: NUSANTARA / Gerbang Kualitas (Quality Gate)
    needs: [static-checks, test-suite]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Verifikasi Standar Kualitas (Cakupan & Konsistensi)
        run: |
          npx tsx pengujian/testing/uji_testing.ts

  # ============================================================================
  # 4. BUILD VALIDATION MATRIX (6 Target Desktop Resmi)
  # Kompatibilitas Fase 24 aliases: windows-x64, linux-x64, macos-x64, macos-arm64 (ref runner: macos-13)
  # ============================================================================
  build-matrix-validation:
    name: NUSANTARA / Validasi Build (${{ matrix.target }})
    needs: quality-gate
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            legacy_target: windows-x64
            triple: x86_64-pc-windows-msvc
            os: windows-latest
            is_native: 'true'
            require_clang: '1'
          - target: windows-arm64
            legacy_target: windows-arm64
            triple: aarch64-pc-windows-msvc
            os: windows-latest
            is_native: 'false'
            require_clang: '1'
          - target: linux-x86_64
            legacy_target: linux-x64
            triple: x86_64-unknown-linux-gnu
            os: ubuntu-latest
            is_native: 'true'
            require_clang: '1'
          - target: linux-arm64
            legacy_target: linux-arm64
            triple: aarch64-unknown-linux-gnu
            os: ubuntu-latest
            is_native: 'false'
            require_clang: '1'
          - target: macos-x86_64
            legacy_target: macos-x64
            triple: x86_64-apple-darwin
            os: macos-latest
            is_native: 'false'
            require_clang: '1'
          - target: macos-arm64
            legacy_target: macos-arm64
            triple: arm64-apple-darwin
            os: macos-latest
            is_native: 'true'
            require_clang: '1'
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Bangun Proyek Web & Kompilator
        run: |
          npm run build

      - name: Pasang Toolchain LLVM/Clang & Cross-Tools (${{ matrix.target }})
        shell: bash
        run: |
          if [ "${{ runner.os }}" = "Linux" ]; then
            sudo apt-get update -y
            if [ "${{ matrix.target }}" = "linux-arm64" ]; then
              sudo apt-get install -y clang lld llvm gcc-aarch64-linux-gnu libc6-dev-arm64-cross qemu-user-static binutils
              aarch64-linux-gnu-gcc --version
              qemu-aarch64-static --version
            else
              sudo apt-get install -y clang lld llvm binutils
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            if ! command -v clang >/dev/null 2>&1; then
              choco install -y llvm
              echo "C:/Program Files/LLVM/bin" >> "$GITHUB_PATH"
              export PATH="/c/Program Files/LLVM/bin:$PATH"
            fi
            if [ "${{ matrix.target }}" = "windows-arm64" ]; then
              ARM64_VC_LIB=$(find "/c/Program Files/Microsoft Visual Studio" -type d -path "*/VC/Tools/MSVC/*/lib/arm64" 2>/dev/null | head -n 1 || true)
              if [ -n "$ARM64_VC_LIB" ]; then
                VC_TOOLS_DIR=$(dirname "$(dirname "$ARM64_VC_LIB")")
                echo "VCToolsInstallDir=$VC_TOOLS_DIR" >> "$GITHUB_ENV"
                echo "[OK] MSVC ARM64 libraries ditemukan: $ARM64_VC_LIB"
              else
                echo "[INFO] MSVC ARM64 libraries (VC/Tools/MSVC/*/lib/arm64) tidak terpasang di runner windows-latest ini."
              fi
              WIN_SDK_ARM64=$(find "/c/Program Files (x86)/Windows Kits/10/Lib" -type d -path "*/um/arm64" 2>/dev/null | head -n 1 || true)
              if [ -n "$WIN_SDK_ARM64" ]; then
                echo "[OK] Windows SDK ARM64 library ditemukan: $WIN_SDK_ARM64"
              else
                echo "[INFO] Windows SDK ARM64 library (Lib/*/um/arm64) tidak terpasang di runner windows-latest ini."
              fi
            fi
          fi
          clang --version

      - name: Uji LLVM Backend (Phase 44), Linker (Phase 45) & Build System (Phase 23) dengan Clang Aktif
        shell: bash
        env:
          NUSANTARA_REQUIRE_CLANG: ${{ matrix.require_clang }}
          NUSANTARA_BUILD_REPORT_DIR: dist-native/reports
        run: |
          npm run test:llvm-v44
          npm run test:linker-v45
          npm run test:build-v23

      - name: Kompilasi, Validasi, Eksekusi & Buat Evidence JSON (${{ matrix.target }})
        shell: bash
        run: |
          mkdir -p artifacts/phase23/evidence dist-native/reports
          npx tsx scripts/phase23-certify.ts generate \
            --target "${{ matrix.target }}" \
            --bundle-dir artifacts/phase23 \
            --fail-on-missing-clang

      - name: Tulis Evidence Target ke Step Summary
        if: always()
        shell: bash
        run: |
          EVIDENCE_FILE="artifacts/phase23/evidence/${{ matrix.target }}.json"
          echo "### Evidence Phase 23.2: \`${{ matrix.target }}\` (\`${{ matrix.triple }}\`)" >> "$GITHUB_STEP_SUMMARY"
          if [ -f "$EVIDENCE_FILE" ]; then
            echo '```json' >> "$GITHUB_STEP_SUMMARY"
            cat "$EVIDENCE_FILE" >> "$GITHUB_STEP_SUMMARY"
            echo '```' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "Evidence JSON tidak terbuat." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Unggah Evidence Target Phase 23.2
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase23-evidence-${{ matrix.target }}
          path: artifacts/phase23
          retention-days: 14
          if-no-files-found: warn

      - name: Validasi Pembuatan Distribusi Target (${{ matrix.target }})
        run: |
          npx tsx -e "import { MesinCI } from './src/cicd'; import { PembacaBerkasNode } from './src/modul/pembacaBerkas'; const ci = new MesinCI({ pembaca: new PembacaBerkasNode(), targetPlatforms: ['${{ matrix.legacy_target }}'] }); const r = ci.jalankan(); if (r.statusAkhir !== 'PASS') process.exit(1);"

      - name: Unggah Artefak Build CI (Retention 7 Hari)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nusantara-ci-${{ matrix.target }}
          path: |
            dist/*
            dist-native/*
          retention-days: 7
          if-no-files-found: warn

  # ============================================================================
  # 5. PHASE 23.2 SIX-TARGET CERTIFICATION AGGREGATION GATE
  # ============================================================================
  phase23-certification-gate:
    name: NUSANTARA / Gerbang Sertifikasi 6 Target (Phase 23.2)
    needs: [build-matrix-validation]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Unduh Seluruh Evidence 6 Target
        uses: actions/download-artifact@v4
        with:
          pattern: phase23-evidence-*
          path: artifacts/phase23
          merge-multiple: true

      - name: Agregasi, Validasi Integritas SHA-256/Biner & Gerbang Sertifikasi Phase 23.2
        id: certify
        run: |
          mkdir -p artifacts/phase23
          set +e
          npx tsx scripts/phase23-certify.ts aggregate \
            --evidence-dir artifacts/phase23/evidence \
            --report-out artifacts/phase23/PHASE-23-CERTIFICATION-REPORT.md \
            --json-out artifacts/phase23/certification-summary.json \
            --step-summary
          GATE_EXIT=$?
          set -e
          cp artifacts/phase23/PHASE-23-CERTIFICATION-REPORT.md PHASE-23-CERTIFICATION-REPORT.md || true
          exit $GATE_EXIT

      - name: Unggah Laporan Sertifikasi Phase 23
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: phase23-certification-report
          path: |
            PHASE-23-CERTIFICATION-REPORT.md
            artifacts/phase23
          retention-days: 30
          if-no-files-found: warn

  # ============================================================================
  # 6. CI SUMMARY & STEP SUMMARY GENERATION
  # ============================================================================
  ci-summary:
    name: NUSANTARA / Ringkasan CI
    needs: [static-checks, test-suite, quality-gate, build-matrix-validation, phase23-certification-gate]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Buat Laporan Ringkasan CI Resmi
        run: |
          echo "## 🇮🇩 NUSANTARA CI SUMMARY (v0.24.0 + Phase 23.2)" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Tahapan Alur Kerja | Status | Runner Host | Keterangan |" >> $GITHUB_STEP_SUMMARY
          echo "| :--- | :---: | :--- | :--- |" >> $GITHUB_STEP_SUMMARY
          echo "| Pemeriksaan Statis (Lint/TSC) | ${{ needs.static-checks.result == 'success' && 'PASS' || 'FAIL' }} | ubuntu-latest | Validasi sintaks dan tipe TypeScript |" >> $GITHUB_STEP_SUMMARY
          echo "| Rangkaian Uji Otomatis | ${{ needs.test-suite.result == 'success' && 'PASS' || 'FAIL' }} | Ubuntu, Windows, macOS | Seluruh unit, integrasi, dan stdlib |" >> $GITHUB_STEP_SUMMARY
          echo "| Gerbang Kualitas (Quality Gate) | ${{ needs.quality-gate.result == 'success' && 'PASS' || 'FAIL' }} | ubuntu-latest | Ambang batas kualitas dan regresi |" >> $GITHUB_STEP_SUMMARY
          echo "| Matriks Build 6 Target Desktop | ${{ needs.build-matrix-validation.result == 'success' && 'SELESAI' || 'GAGAL/TIDAK LENGKAP' }} | Multi-OS Matrix | Eksekusi per-target menghasilkan JSON evidence terpisah |" >> $GITHUB_STEP_SUMMARY
          echo "| Gerbang Sertifikasi 6 Target (Phase 23.2) | ${{ needs.phase23-certification-gate.result == 'success' && 'CERTIFIED (6/6 PASS)' || 'PARTIAL / FAILED (Belum CERTIFIED)' }} | ubuntu-latest | Wajib 6/6 target PASS + SHA-256 & header biner sah |" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Status Release**: \`NOT PUBLISHED\` (CI Pipeline tidak mempublikasikan rilis publik)." >> $GITHUB_STEP_SUMMARY

