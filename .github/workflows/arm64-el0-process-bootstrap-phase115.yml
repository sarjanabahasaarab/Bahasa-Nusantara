name: ARM64 EL0 Process Bootstrap — Phase 115

on:
  pull_request:
    paths:
      - 'src/runtime/os/arch/arm64/exception.c'
      - 'src/runtime/os/arch/arm64/exception.h'
      - 'pengujian/os/uji_arm64_el0_context_fase115.c'
      - 'docs/os/arm64/PHASE-115-EL0-PROCESS-BOOTSTRAP.md'
      - '.github/workflows/arm64-el0-process-bootstrap-phase115.yml'
  push:
    branches: [main]
    paths:
      - 'src/runtime/os/arch/arm64/exception.c'
      - 'src/runtime/os/arch/arm64/exception.h'
      - 'pengujian/os/uji_arm64_el0_context_fase115.c'
      - 'docs/os/arm64/PHASE-115-EL0-PROCESS-BOOTSTRAP.md'
      - '.github/workflows/arm64-el0-process-bootstrap-phase115.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile EL0 context test with strict diagnostics
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Isrc/runtime/os/arch/arm64 \
            src/runtime/os/arch/arm64/exception.c \
            pengujian/os/uji_arm64_el0_context_fase115.c \
            -o /tmp/nusantara-phase115-el0-context
      - name: Run EL0 context tests
        run: /tmp/nusantara-phase115-el0-context
