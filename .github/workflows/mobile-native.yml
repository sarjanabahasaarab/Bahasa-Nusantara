name: NUSANTARA Mobile Native Validation

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: mobile-native-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android-native:
    name: Android Gradle, APK/AAB, signing and emulator
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Setup JDK
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Install Android SDK components
        shell: bash
        run: |
          set -euo pipefail
          npm ci
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "platform-tools" "build-tools;35.0.0" "platforms;android-35" "emulator" "system-images;android-35;google_apis;x86_64"
          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"
          echo "no" | avdmanager create avd --force --name nusantara-api35 --package "system-images;android-35;google_apis;x86_64"
      - name: Build real APK and AAB with ephemeral release key
        id: android_build
        shell: bash
        run: |
          set -euo pipefail
          KEYSTORE="$RUNNER_TEMP/nusantara-ephemeral.jks"
          STORE_PASS="$(openssl rand -hex 24)"
          KEY_PASS="$STORE_PASS"
          keytool -genkeypair -noprompt -storetype JKS -keystore "$KEYSTORE" -storepass "$STORE_PASS" -keypass "$KEY_PASS" -alias nusantara_ci -keyalg RSA -keysize 2048 -validity 2 -dname "CN=Nusantara CI,O=Nusantara,C=ID"
          export NUSANTARA_ANDROID_KEYSTORE="$KEYSTORE"
          export NUSANTARA_ANDROID_KEY_ALIAS=nusantara_ci
          export NUSANTARA_ANDROID_STORE_PASSWORD="$STORE_PASS"
          export NUSANTARA_ANDROID_KEY_PASSWORD="$KEY_PASS"
          gradle --no-daemon -p native/android -PapplicationId=id.nusantara.aplikasi :app:testDebugUnitTest :app:assembleDebug :app:assembleRelease :app:bundleRelease
          APK_DEBUG="native/android/app/build/outputs/apk/debug/app-debug.apk"
          APK_RELEASE="native/android/app/build/outputs/apk/release/app-release.apk"
          AAB="native/android/app/build/outputs/bundle/release/app-release.aab"
          test -s "$APK_DEBUG"
          test -s "$APK_RELEASE"
          test -s "$AAB"
          unzip -Z1 "$APK_DEBUG" | grep -Fx classes.dex
          unzip -Z1 "$AAB" | grep -Fx BundleConfig.pb
          unzip -Z1 "$AAB" | grep "base/dex/classes" | grep ".dex"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_DEBUG"
          "$ANDROID_HOME/build-tools/35.0.0/apksigner" verify --verbose "$APK_RELEASE"
          echo "APK_DEBUG=$APK_DEBUG" >> "$GITHUB_ENV"
          echo "EPHEMERAL_SIGNING_VERIFIED=true" >> "$GITHUB_ENV"
      - name: Boot emulator, install and launch native APK
        id: android_emulator
        shell: bash
        run: |
          set -euo pipefail
          emulator -avd nusantara-api35 -no-snapshot -no-window -no-audio -no-boot-anim -gpu swiftshader_indirect > "$RUNNER_TEMP/emulator.log" 2>&1 &
          adb wait-for-device
          for attempt in $(seq 1 120); do
            if [ "$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)" = "1" ]; then break; fi
            sleep 5
          done
          test "$(adb shell getprop sys.boot_completed | tr -d '\r')" = "1"
          adb install -r "$APK_DEBUG"
          adb shell am start -n id.nusantara.aplikasi/id.nusantara.mobile.MainActivity
          sleep 5
          adb shell pidof id.nusantara.aplikasi
          echo "ANDROID_EMULATOR_LAUNCHED=true" >> "$GITHUB_ENV"
      - name: Run mobile regression suites Phase 37–42
        id: android_mobile_tests
        run: |
          npm run test:mobile-v37
          npm run test:native-api-v38
          npm run test:mobile-networking-v39
          npm run test:distribusi-v40
          npm run test:publikasi-v41
          npm run test:pembaruan-v42
          echo "MOBILE_TESTS_PASS=true" >> "$GITHUB_ENV"
      - name: Write Android evidence
        if: always()
        env:
          ANDROID_BUILD_OUTCOME: ${{ steps.android_build.outcome }}
          ANDROID_EMULATOR_OUTCOME: ${{ steps.android_emulator.outcome }}
          ANDROID_TESTS_OUTCOME: ${{ steps.android_mobile_tests.outcome }}
        shell: bash
        run: |
          mkdir -p artifacts/mobile-evidence
          python3 - <<'PY'
          import datetime, json, os, platform, zipfile
          outcomes = [os.environ.get("ANDROID_BUILD_OUTCOME"), os.environ.get("ANDROID_EMULATOR_OUTCOME"), os.environ.get("ANDROID_TESTS_OUTCOME")]
          failed = "failure" in outcomes
          complete = all(value == "success" for value in outcomes)
          apk = "native/android/app/build/outputs/apk/debug/app-debug.apk"
          aab = "native/android/app/build/outputs/bundle/release/app-release.aab"
          def has_entry(archive, predicate):
            try:
              with zipfile.ZipFile(archive) as zf:
                return any(predicate(name) for name in zf.namelist())
            except (OSError, zipfile.BadZipFile):
              return False
          apk_has_dex = has_entry(apk, lambda name: name == "classes.dex")
          aab_has_bundle = has_entry(aab, lambda name: name == "BundleConfig.pb") and has_entry(aab, lambda name: name.startswith("base/dex/classes") and name.endswith(".dex"))
          payload = {
            "schemaVersion": 1,
            "jobId": "phase37-42-android-native-ci",
            "phase": "37,38,40,41",
            "runner": "ubuntu-latest",
            "os": "Linux",
            "arch": platform.machine(),
            "status": "FAIL" if failed else "PASS" if complete else "NOT_VERIFIED",
            "unitTestStatus": "PASS" if os.environ.get("MOBILE_TESTS_PASS") == "true" else "FAIL" if os.environ.get("ANDROID_TESTS_OUTCOME") == "failure" else "NOT_VERIFIED",
            "commitSha": os.environ["GITHUB_SHA"],
            "workflowRunId": os.environ["GITHUB_RUN_ID"],
            "evidenceScope": "ci-workflow",
            "isNativeHardware": False,
            "details": {
              "apkCompiledWithDex": apk_has_dex,
              "aabBuiltWithBundletool": aab_has_bundle,
              "apksignerVerified": os.environ.get("EPHEMERAL_SIGNING_VERIFIED") == "true",
              "emulatorBooted": os.environ.get("ANDROID_EMULATOR_LAUNCHED") == "true",
              "physicalDeviceHardwareVerified": False,
              "ephemeralKeystoreSigned": os.environ.get("EPHEMERAL_SIGNING_VERIFIED") == "true",
              "nativeSpkiPinningVerified": False,
              "playCoreAndStoreKitVerified": False
            },
            "blockers": ["CI emulator is not a physical handset; camera/GNSS/IMU/BLE/TEE and cellular SPKI tests remain unverified. Play Core production testing requires a Play-distributed internal track."],
            "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          }
          with open("artifacts/mobile-evidence/phase37-42-android.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, indent=2)
            f.write("\n")
          PY
      - name: Upload Android APK/AAB and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nusantara-android-native-evidence
          path: |
            native/android/app/build/outputs/apk/**/*.apk
            native/android/app/build/outputs/bundle/**/*.aab
            artifacts/mobile-evidence/
          retention-days: 30
          if-no-files-found: warn

  ios-native:
    name: iOS SwiftUI build and Simulator launch
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Run mobile regression suites Phase 37–42
        id: ios_mobile_tests
        run: |
          npm ci
          npm run test:mobile-v37
          npm run test:native-api-v38
          npm run test:mobile-networking-v39
          npm run test:distribusi-v40
          npm run test:publikasi-v41
          npm run test:pembaruan-v42
      - name: Build SwiftUI app and launch iOS Simulator
        id: ios_simulator_build
        shell: bash
        run: |
          set -euo pipefail
          brew install xcodegen
          xcodegen generate --spec native/ios/project.yml --project native/ios
          SIM_UDID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; d=json.load(sys.stdin); print(next(x["udid"] for group in d["devices"].values() for x in group if x.get("isAvailable") and x["name"].startswith("iPhone")))')
          xcrun simctl boot "$SIM_UDID" 2>/dev/null || true
          xcrun simctl bootstatus "$SIM_UDID" -b
          xcodebuild test -project native/ios/NusantaraMobile.xcodeproj -scheme NusantaraMobile -destination "platform=iOS Simulator,id=$SIM_UDID" -derivedDataPath "$RUNNER_TEMP/nusantara-ios-derived" CODE_SIGNING_ALLOWED=NO
          APP_PATH="$RUNNER_TEMP/nusantara-ios-derived/Build/Products/Debug-iphonesimulator/NUSANTARA.app"
          test -d "$APP_PATH"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -s "$APP_PATH/$EXECUTABLE"
          file "$APP_PATH/$EXECUTABLE" | grep -E 'Mach-O'
          xcrun simctl install "$SIM_UDID" "$APP_PATH"
          xcrun simctl launch "$SIM_UDID" id.nusantara.mobile
          echo "IOS_MACHO_COMPILED=true" >> "$GITHUB_ENV"
          echo "IOS_SIMULATOR_LAUNCHED=true" >> "$GITHUB_ENV"
      - name: Build unsigned iOS device .xcarchive (Phase 40 evidence)
        id: ios_device_archive
        shell: bash
        run: |
          set -euo pipefail
          ARCHIVE_PATH="$RUNNER_TEMP/NUSANTARA-device.xcarchive"
          xcodebuild archive \
            -project native/ios/NusantaraMobile.xcodeproj \
            -scheme NusantaraMobile \
            -destination "generic/platform=iOS" \
            -archivePath "$ARCHIVE_PATH" \
            CODE_SIGNING_ALLOWED=NO
          APP_PATH="$ARCHIVE_PATH/Products/Applications/NUSANTARA.app"
          test -d "$APP_PATH"
          EXECUTABLE=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP_PATH/Info.plist")
          test -s "$APP_PATH/$EXECUTABLE"
          file "$APP_PATH/$EXECUTABLE" | grep -E 'Mach-O'
          lipo -info "$APP_PATH/$EXECUTABLE" | grep -q 'arm64'
          echo "IOS_XCARCHIVE_BUILT=true" >> "$GITHUB_ENV"
      - name: Write iOS evidence
        if: always()
        env:
          IOS_TESTS_OUTCOME: ${{ steps.ios_mobile_tests.outcome }}
          IOS_BUILD_OUTCOME: ${{ steps.ios_simulator_build.outcome }}
          IOS_ARCHIVE_OUTCOME: ${{ steps.ios_device_archive.outcome }}
        shell: bash
        run: |
          mkdir -p artifacts/mobile-evidence
          python3 - <<'PY'
          import datetime, json, os, platform
          outcomes = [os.environ.get("IOS_TESTS_OUTCOME"), os.environ.get("IOS_BUILD_OUTCOME"), os.environ.get("IOS_ARCHIVE_OUTCOME")]
          failed = "failure" in outcomes
          complete = all(value == "success" for value in outcomes)
          payload = {
            "schemaVersion": 1,
            "jobId": "phase37-42-ios-native-ci",
            "phase": "37,38,40,41",
            "runner": "macos-latest",
            "os": "macOS",
            "arch": platform.machine(),
            "status": "FAIL" if failed else "PASS" if complete else "NOT_VERIFIED",
            "unitTestStatus": "PASS" if os.environ.get("IOS_TESTS_OUTCOME") == "success" else "FAIL" if os.environ.get("IOS_TESTS_OUTCOME") == "failure" else "NOT_VERIFIED",
            "commitSha": os.environ["GITHUB_SHA"],
            "workflowRunId": os.environ["GITHUB_RUN_ID"],
            "evidenceScope": "ci-workflow",
            "isNativeHardware": False,
            "details": {
              "machOCompiled": os.environ.get("IOS_MACHO_COMPILED") == "true",
              "simulatorLaunched": os.environ.get("IOS_SIMULATOR_LAUNCHED") == "true",
              "xcarchiveBuilt": os.environ.get("IOS_XCARCHIVE_BUILT") == "true",
              "ipaProduced": False,
              "adHocOrDevSigned": False,
              "physicalDeviceHardwareVerified": False,
              "nativeSpkiPinningVerified": False,
              "playCoreAndStoreKitVerified": False
            },
            "blockers": ["CI builds an unsigned device .xcarchive only. It does not produce a signed IPA or verify physical iPhone/iPad hardware, device signing, native SPKI, or production StoreKit."],
            "generatedAt": datetime.datetime.now(datetime.timezone.utc).isoformat().replace("+00:00", "Z")
          }
          with open("artifacts/mobile-evidence/phase37-42-ios.json", "w", encoding="utf-8") as f:
            json.dump(payload, f, indent=2)
            f.write("\n")
          PY
      - name: Upload iOS Simulator app and evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nusantara-ios-simulator-app
          path: |
            ${{ runner.temp }}/nusantara-ios-derived/Build/Products/Debug-iphonesimulator/NUSANTARA.app
            ${{ runner.temp }}/NUSANTARA-device.xcarchive
            native/ios/NusantaraMobile.xcodeproj
            artifacts/mobile-evidence/
          retention-days: 30
          if-no-files-found: warn
