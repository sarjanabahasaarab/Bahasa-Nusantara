name: ARM64 process scheduler contract — Phase 120
on:
  pull_request:
    paths:
      - 'src/runtime/os/arch/arm64/process-scheduler.*'
      - 'src/runtime/os/arch/arm64/process-bootstrap.*'
      - 'src/runtime/os/arch/arm64/address-space.*'
      - 'src/runtime/os/scheduler/scheduler.*'
      - 'pengujian/os/uji_arm64_process_scheduler_fase120.c'
      - '.github/workflows/arm64-process-scheduler-phase120.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  process-scheduler-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict C11 scheduler contract
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Isrc/runtime/os/arch/arm64 -Isrc/runtime/os/scheduler \
            src/runtime/os/scheduler/scheduler.c \
            src/runtime/os/arch/arm64/mmu.c \
            src/runtime/os/arch/arm64/address-space.c \
            src/runtime/os/arch/arm64/process-scheduler.c \
            pengujian/os/uji_arm64_process_scheduler_fase120.c \
            -o /tmp/nusantara-phase120-process-scheduler
      - name: Run multi-process scheduling and address-space contract
        run: /tmp/nusantara-phase120-process-scheduler
