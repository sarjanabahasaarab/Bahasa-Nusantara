name: NUSANTARA Automated Release & Distribution

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Versi rilis target (contoh: 0.50.0)'
        required: true
        default: '0.50.0'
      confirm_release:
        description: 'Konfirmasi eksplisit: Setujui publikasi rilis resmi NUSANTARA (true/false)'
        type: boolean
        required: true
        default: false
      release_type:
        description: 'Tipe rilis GitHub'
        type: choice
        options:
          - 'release'
          - 'draft'
          - 'prerelease'
        default: 'release'
      dry_run:
        description: 'Uji alur rilis non-produksi (periksa manifest & metadata tanpa membuat tag/release)'
        type: boolean
        default: true
  push:
    tags:
      - 'v*.*.*'

# Least-Privilege Permissions at root
permissions:
  contents: read

# Concurrency: Jangan pernah membatalkan rilis yang sedang berlangsung di tengah jalan
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # ============================================================================
  # 1. VERIFIKASI PERSETUJUAN & INTEGRITAS VERSI
  # ============================================================================
  verify-release-approval:
    name: NUSANTARA / Verifikasi Persetujuan & Versi
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Periksa Persetujuan Manual Pengguna
        if: github.event_name == 'workflow_dispatch'
        run: |
          if [ "${{ inputs.dry_run }}" != "true" ] && [ "${{ inputs.confirm_release }}" != "true" ]; then
            echo "❌ [GAGAL] Persetujuan eksplisit rilis belum diberikan (confirm_release=false)."
            echo "Rilis resmi tidak dapat dilanjutkan tanpa persetujuan manual pengguna."
            exit 1
          fi
          if [ "${{ inputs.confirm_release }}" != "true" ]; then
            echo "ℹ️ Mode dry-run berjalan tanpa persetujuan publikasi penuh; publikasi tetap diblokir."
          else
            echo "✅ Persetujuan manual rilis telah dikonfirmasi oleh pengguna."
          fi

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Validasi Konsistensi Versi Proyek (Tanpa Mengubah Versi)
        run: |
          npx tsx -e "
            import { VERSI_NUSANTARA } from './src/konstanta/versi';
            import fs from 'node:fs';
            console.log('Versi Resmi:', VERSI_NUSANTARA);
            const toml = fs.readFileSync('nusantara.toml', 'utf-8');
            const pkg = JSON.parse(fs.readFileSync('package.json', 'utf-8'));
            if (!toml.includes('versi = \"' + VERSI_NUSANTARA + '\"') || pkg.version !== VERSI_NUSANTARA) {
              console.error('Ketidakkonsistenan versi antara versi.ts, nusantara.toml, dan package.json');
              process.exit(1);
            }
            console.log('✅ Konsistensi versi tervalidasi (0 perubahan versi).');
          "

  # ============================================================================
  # 2. RUN CONSISTENT CI TEST SUITE, DEMO TERPADU & QUALITY GATE
  # ============================================================================
  test-and-gate:
    name: NUSANTARA / Pengujian Konsisten CI & Quality Gate
    needs: verify-release-approval
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Jalankan Static Check, Build, & Seluruh Rangkaian Uji Konsisten CI
        run: |
          npm run lint
          npm run build
          npm test
          npm run test:cicd
          npm run test:cert-gate
          npm run test:mobile-networking-v39
          npm run test:pembaruan-v42
          npm run test:demo-terpadu

      - name: Verifikasi Integritas Artefak & SHA256SUMS Demo Terpadu
        run: |
          npx tsx scripts/certification-gate.ts verify-artifacts --dir artifacts/demo-terpadu --min-artifacts 20

      - name: Verifikasi Quality Gate
        run: |
          npm run quality-gate

  # ============================================================================
  # 3. CERTIFICATION GATE PROTECTION (MEMBLOKIR RILIS BILA ADA FAIL/SKIPPED/NOT_VERIFIED/BLOCKED)
  # ============================================================================
  verify-certification-gate:
    name: NUSANTARA / Verifikasi Gerbang Sertifikasi Sebelum Rilis
    needs: test-and-gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Periksa Status CI Unified Certification Gate pada Commit Target & Evaluasi Ketat
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p artifacts/certification
          IS_DRY_RUN="${{ github.event_name == 'workflow_dispatch' && inputs.dry_run }}"
          if [ "$IS_DRY_RUN" = "true" ]; then
            echo "=== MODE DRY-RUN NON-PRODUKSI: Memeriksa manifest, metadata & laporan sertifikasi tanpa membuat tag/release ==="
            npx tsx scripts/certification-gate.ts evaluate \
              --demo-dir artifacts/demo-terpadu \
              --phase23-evidence-dir artifacts/phase23/evidence \
              --json-out artifacts/certification/RELEASE-DRYRUN-GATE.json \
              --md-out artifacts/certification/RELEASE-DRYRUN-GATE.md \
              --dry-run \
              --step-summary
          else
            echo "=== RELEASE GATE KETAT: Mewajibkan CI 'unified-certification-gate' PASS & 0 FAIL/SKIPPED/NOT_VERIFIED/BLOCKED ==="
            CI_STATUS=$(gh api "repos/${{ github.repository }}/commits/${{ github.sha }}/check-runs" --jq '[.check_runs[] | select(.name | test("Gerbang Sertifikasi Terpusat|Gerbang Sertifikasi 6 Target")) | .conclusion] | if length == 0 then "MISSING" else (if all(. == "success") then "PASS" else "NOT_PASS" end) end' 2>/dev/null || echo "UNAVAILABLE")
            echo "Status CI Certification Check pada commit ${{ github.sha }}: $CI_STATUS"
            if [ "$CI_STATUS" != "PASS" ]; then
              echo "❌ [BLOCKED] Commit ini belum lolos 'Gerbang Sertifikasi Terpusat' di workflow CI (status=$CI_STATUS). Rilis DIBLOKIR."
              exit 1
            fi
            npx tsx scripts/certification-gate.ts evaluate \
              --demo-dir artifacts/demo-terpadu \
              --phase23-evidence-dir artifacts/phase23/evidence \
              --commit "${{ github.sha }}" \
              --run-id "${{ github.run_id }}" \
              --require-ci-provenance \
              --json-out artifacts/certification/RELEASE-GATE-REPORT.json \
              --md-out artifacts/certification/RELEASE-GATE-REPORT.md \
              --step-summary
          fi

      - name: Unggah Laporan Gate Rilis
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: release-certification-gate-report
          path: artifacts/certification/
          retention-days: 14
          if-no-files-found: warn

  # ============================================================================
  # 4. BUILD RELEASE ARTIFACTS MATRIX (SEMUA RUNNER AKTIF / ROSETTA 2)
  # ============================================================================
  build-release-artifacts:
    name: NUSANTARA / Bangun Artefak Rilis (${{ matrix.target }})
    needs: verify-certification-gate
    runs-on: ${{ (matrix.target == 'linux-arm64' && vars.DISABLE_LINUX_ARM64_RUNNER == 'true') && 'ubuntu-latest' || matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - target: windows-x86_64
            os: windows-latest
          - target: windows-arm64
            os: windows-11-arm
          - target: linux-x86_64
            os: ubuntu-latest
          - target: linux-arm64
            os: ubuntu-24.04-arm
          - target: macos-x86_64
            os: macos-latest
          - target: macos-arm64
            os: macos-latest
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Pasang Dependensi
        run: npm ci

      - name: Bangun Distribusi Bersih Resmi (${{ matrix.target }})
        run: |
          npx tsx -e "
            import { MesinCI } from './src/cicd';
            import { PembacaBerkasNode } from './src/modul/pembacaBerkas';
            const mesin = new MesinCI({
              pembaca: new PembacaBerkasNode(),
              targetPlatforms: ['${{ matrix.target }}'],
              simulasikanRilis: true,
              persetujuanRilis: '${{ inputs.dry_run }}' !== 'true' && '${{ inputs.confirm_release }}' === 'true'
            });
            const hasil = mesin.jalankan();
            if (hasil.statusAkhir !== 'PASS') {
              console.error('Build rilis gagal:', hasil.ringkasanTeks);
              process.exit(1);
            }
            console.log('Build rilis sukses:', hasil.artefak.length, 'artefak dihasilkan.');
          "

      - name: Unggah Artefak Rilis Sementara
        uses: actions/upload-artifact@v4
        with:
          name: release-pkg-${{ matrix.target }}
          path: dist/*
          retention-days: 1

  # ============================================================================
  # 5. COMPILE CHECKSUMS, MANIFEST & VALIDASI INTEGRITAS
  # ============================================================================
  compile-release-bundle:
    name: NUSANTARA / Kompilasi SHA256SUMS & Manifest
    needs: build-release-artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Pasang Lingkungan Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Unduh Seluruh Artefak Terkompilasi
        uses: actions/download-artifact@v4
        with:
          pattern: release-pkg-*
          path: dist/
          merge-multiple: true

      - name: Hitung Checksum SHA-256 & Buat Manifest Rilis Dinamis
        run: |
          npx tsx -e "
            import fs from 'node:fs';
            import crypto from 'node:crypto';
            import { VERSI_NUSANTARA } from './src/konstanta/versi';

            const files = fs.readdirSync('dist').filter(f => f.endsWith('.zip') || f.endsWith('.tar.gz')).sort();
            if (files.length === 0) {
              console.error('Tidak ada arsip rilis ditemukan di dist/');
              process.exit(1);
            }
            console.log('Menghitung SHA-256 untuk berkas:', files);
            const shaLines = [];
            const manifestItems = [];

            for (const f of files) {
              const buf = fs.readFileSync('dist/' + f);
              const hash = crypto.createHash('sha256').update(buf).digest('hex');
              shaLines.push(hash + '  ' + f);
              manifestItems.push({ filename: f, sha256: hash, sizeBytes: buf.length });
            }

            fs.writeFileSync('dist/SHA256SUMS', shaLines.join('\n') + '\n');
            const manifest = {
              name: 'nusantara',
              version: VERSI_NUSANTARA,
              commitSha: process.env.GITHUB_SHA || 'unknown',
              dryRun: '${{ inputs.dry_run }}' === 'true',
              generatedAt: new Date().toISOString(),
              artifacts: manifestItems
            };
            fs.writeFileSync('dist/release-manifest.json', JSON.stringify(manifest, null, 2));
            console.log('✅ SHA256SUMS dan release-manifest.json berhasil dibuat dengan timestamp dinamis.');
          "

      - name: Validasi Integritas SHA256SUMS & Kelengkapan Manifest
        run: |
          cd dist && sha256sum -c SHA256SUMS
          cd .. && npx tsx -e "
            import fs from 'node:fs';
            const mf = JSON.parse(fs.readFileSync('dist/release-manifest.json', 'utf8'));
            if (!mf.version || !mf.generatedAt || !Array.isArray(mf.artifacts) || mf.artifacts.length === 0) {
              console.error('Manifest rilis tidak lengkap');
              process.exit(1);
            }
            for (const a of mf.artifacts) {
              if (!a.filename || !/^[a-f0-9]{64}$/.test(a.sha256) || !a.sizeBytes) {
                console.error('Entri manifest rusak:', a);
                process.exit(1);
              }
            }
            console.log('✅ Kelengkapan metadata release-manifest.json terverifikasi:', mf.artifacts.length, 'artefak.');
          "

      - name: Unggah Bundel Rilis Siap Inspeksi (Retention 14 Hari)
        uses: actions/upload-artifact@v4
        with:
          name: nusantara-release-bundle
          path: dist/*
          retention-days: 14

  # ============================================================================
  # 6. PUBLIKASI RELEASE GITHUB (TERBLOKIR PADA DRY-RUN, TAG PUSH OTOMATIS, ATAU GATE BELUM LULUS)
  # ============================================================================
  publish-release:
    name: NUSANTARA / Publikasi Rilis Resmi
    needs: [compile-release-bundle, verify-certification-gate]
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run != true && inputs.confirm_release == true }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Elevated permissions ONLY on the publishing job
    permissions:
      contents: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Unduh Bundel Rilis
        uses: actions/download-artifact@v4
        with:
          name: nusantara-release-bundle
          path: dist/

      - name: Siapkan Catatan Rilis Resmi
        id: notes
        run: |
          RELEASE_VER="${{ inputs.version || '0.50.0' }}"
          cat << EOF > dist/RELEASE_NOTES.md
          # 🇮🇩 Bahasa Pemrograman NUSANTARA — Rilis v${RELEASE_VER}

          Rilis resmi ekosistem Bahasa Pemrograman & Sistem Operasi NUSANTARA.

          ### 🚀 Cakupan Rilis:
          - **GitHub Actions CI/CD & Quality Gate**: Pemeriksaan statis, uji regresi multi-OS (Linux, Windows, macOS), dan Quality Gate.
          - **Gerbang Sertifikasi Terpusat**: Seluruh kriteria Phase 23 serta Phase 36–42 terverifikasi lulus sebelum publikasi.
          - **Integritas Kriptografis**: Checksum SHA-256 resmi (\`SHA256SUMS\`) dan manifest terstruktur (\`release-manifest.json\`).

          ### 📦 Verifikasi Integritas Checksum:
          Lihat berkas \`SHA256SUMS\` terlampir untuk memverifikasi keaslian bundel biner.
          EOF

      - name: Publikasikan Rilis GitHub (Hanya Jika Bukan Dry Run & Gate Lulus)
        if: inputs.dry_run != true && inputs.confirm_release == true
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/*.zip
            dist/*.tar.gz
            dist/SHA256SUMS
            dist/release-manifest.json
          name: "NUSANTARA v${{ inputs.version || '0.50.0' }} — Release & Distribution"
          tag_name: v${{ inputs.version || '0.50.0' }}
          body_path: dist/RELEASE_NOTES.md
          draft: ${{ inputs.release_type == 'draft' }}
          prerelease: ${{ inputs.release_type == 'prerelease' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Buat Ringkasan Publikasi di Step Summary
        if: always()
        run: |
          echo "## 🇮🇩 NUSANTARA RELEASE SUMMARY (v${{ inputs.version || '0.50.0' }})" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Status Eksekusi Rilis**: ${{ job.status == 'success' && '✅ SUKSES' || '❌ GAGAL' }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Tipe Rilis**: \`${{ inputs.release_type || 'release' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run**: \`${{ inputs.dry_run || 'true' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Catatan Keamanan**: Publikasi toko aplikasi produksi tidak dijalankan otomatis oleh workflow ini." >> $GITHUB_STEP_SUMMARY
