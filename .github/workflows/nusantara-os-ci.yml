name: "NUSANTARA OS — Continuous Integration & Real QEMU Validation"

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # ============================================================================
  # 1. STATIC ANALYSIS & TYPE CHECKING
  # ============================================================================
  static-analysis:
    name: "1. Pemeriksaan Statis & Analisis Tipe"
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Run TypeScript Linter & Typecheck"
        run: |
          npm run lint
          npx tsc --noEmit

  # ============================================================================
  # 2. UNIT & COMPILER CORE TEST SUITES
  # ============================================================================
  unit-and-compiler-tests:
    name: "2. Pengujian Unit & Kompilator Inti"
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Audit Fondasi Proyek (Phase 1–5)"
        run: node skrip/periksa_fondasi.js

      - name: "Verifikasi Node.js 22 LTS & Native node:sqlite (DatabaseSync)"
        run: |
          node -v
          node -e "const s = process.getBuiltinModule('node:sqlite'); if (!s || typeof s.DatabaseSync !== 'function') { console.error('[GALAT] node:sqlite DatabaseSync unavailable on ' + process.version); process.exit(1); } console.log('[OK] node:sqlite DatabaseSync verified:', process.version);"

      - name: "Jalankan Pengujian Basis Data SQLite (Phase 29)"
        run: |
          npm run test:database-v29
          npm run test:database-browser-v29

      - name: "Jalankan Suite Uji Leksikal, Sintaks, & Semantik"
        run: |
          npm run test:lexer
          npm run test:parser
          npm run test:interpreter
          npm run test:tipe
          npm run test:operator
          npm run test:percabangan
          npm run test:perulangan
          npm run test:fungsi
          npm run test:struktur-data
          npm run test:modul
          npm run test:paket
          npm run test:stdlib
          npm run test:diagnostik
          npm run test:toolchain
          npm run test:lsp

  # ============================================================================
  # 3. LLVM BACKEND, NIR, & NATIVE EXECUTABLE TESTS
  # ============================================================================
  llvm-and-native-tests:
    name: "3. Pengujian NIR, LLVM Backend & Native Linker"
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Jalankan Pengujian NIR SSA & Optimizer (Phase 43)"
        run: npm run test:nir-v43

      - name: "Jalankan Pengujian LLVM Backend & AOT (Phase 44)"
        run: npm run test:llvm-v44

      - name: "Jalankan Pengujian Linker & Standalone Packager (Phase 45)"
        run: npm run test:linker-v45

      - name: "Jalankan Pengujian Concurrency & Actor Model (Phase 46)"
        run: npm run test:actor-v46

      - name: "Jalankan Pengujian Game SDK (Phase 47)"
        run: npm run test:game-v47

  # ============================================================================
  # 4. KERNEL PHASE 48 — MINIMAL KERNEL INTERFACE
  # ============================================================================
  kernel-phase48-interface:
    name: "4. Pengujian Nusantara OS Minimal Kernel (Phase 48)"
    needs: static-analysis
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Jalankan Suite Uji Minimal Kernel Interface (Phase 48)"
        run: npm run test:os-v48

  # ============================================================================
  # 5. KERNEL PHASE 49 — BOOTABLE KERNEL & HARDWARE VALIDATION
  # ============================================================================
  kernel-phase49-bootable:
    name: "5. Pengujian Bootable Kernel & Multiboot2 (Phase 49)"
    needs: kernel-phase48-interface
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Jalankan Suite Uji Bootable Kernel & Multiboot2 (Phase 49)"
        run: npm run test:boot-v49

  # ============================================================================
  # 6. KERNEL PHASE 50 — USER MODE & PROCESS ISOLATION
  # ============================================================================
  kernel-phase50-usermode:
    name: "6. Pengujian Process Isolation & User Mode (Phase 50)"
    needs: kernel-phase49-bootable
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Jalankan Suite Uji Quality Gate 46: User Mode & Isolation (Phase 50)"
        run: npm run test:usermode-v50

  # ============================================================================
  # 7. KERNEL BUILD & BOOTABLE ISO GENERATION
  # ============================================================================
  kernel-build-and-iso:
    name: "7. Build Biner ELF & Pembangkitan ISO Bootable"
    needs: [unit-and-compiler-tests, llvm-and-native-tests, kernel-phase50-usermode]
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install System Toolchains (QEMU, Clang, LLD, Xorriso, GRUB)"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qemu-system-x86 \
            clang \
            lld \
            xorriso \
            grub-pc-bin \
            grub-common \
            mtools \
            make \
            gcc \
            nasm

      - name: "Install Project Dependencies"
        run: npm ci

      - name: "Verifikasi Ketersediaan Toolchain Host"
        run: |
          chmod +x scripts/*
          ./scripts/check-toolchain.sh

      - name: "Bangun Biner ELF64 Kernel, User ELFs & Image ISO Bootable"
        run: npm run build:artifacts-v50

      - name: "Validasi Struktur Header Multiboot2, ELF64, & El Torito GRUB2 ISO"
        run: |
          npx tsx src/index.ts os inspect-boot artifacts/phase50/kernel.elf
          npx tsx src/index.ts os inspect artifacts/phase50/kernel.elf
          npx tsx src/index.ts os inspect artifacts/phase50/user.elf
          npx tsx src/index.ts os inspect artifacts/phase50/user-fault-test.elf
          grub-file --is-x86-multiboot2 artifacts/phase50/kernel.elf
          test -s artifacts/phase50/nusantara-os.iso
          xorriso -indev artifacts/phase50/nusantara-os.iso -report_el_torito plain

      - name: "Simpan Artefak Build untuk Tahap Validasi QEMU"
        uses: actions/upload-artifact@v4
        with:
          name: nusantara-build-staging
          path: artifacts/phase50/*
          retention-days: 1

  # ============================================================================
  # 8. REAL QEMU BARE-METAL EXECUTION & HARDWARE VALIDATION
  # ============================================================================
  qemu-hardware-validation:
    name: "8. Eksekusi Nyata QEMU Headless & Validasi 18 Sentinel"
    needs: kernel-build-and-iso
    runs-on: ubuntu-latest
    steps:
      - name: "Checkout Source Code"
        uses: actions/checkout@v4

      - name: "Setup Node.js Environment"
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: "npm"

      - name: "Install QEMU x86_64 Emulator"
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86

      - name: "Unduh Artefak Build dari Tahap Staging"
        uses: actions/download-artifact@v4
        with:
          name: nusantara-build-staging
          path: artifacts/phase50

      - name: "Jalankan QEMU Headless dengan Port Debug 0xF4 & Monitor Serial"
        run: |
          chmod +x scripts/*
          ./scripts/run-phase50-qemu.sh --skip-build

      - name: "Hitung Ulang & Validasi SHA256SUMS Seluruh Artefak"
        run: |
          cd artifacts/phase50
          for f in \
            kernel.elf \
            user.elf \
            user-test.elf \
            user-fault-test.elf \
            nusantara-os.iso \
            nusantara-phase50.iso \
            boot.log \
            qemu.log \
            serial.log \
            qemu-exit-code.txt \
            elf-validation.txt \
            isolation-test-report.txt \
            toolchain-versions.txt \
            test-report.txt \
            test-results.txt \
            FINAL-CERTIFICATION.md; do
            test -f "$f" || { echo "[GALAT] Artefak wajib hilang: $f"; exit 1; }
          done
          sha256sum kernel.elf user.elf user-test.elf user-fault-test.elf nusantara-os.iso nusantara-phase50.iso boot.log qemu.log serial.log qemu-exit-code.txt elf-validation.txt isolation-test-report.txt toolchain-versions.txt test-report.txt test-results.txt FINAL-CERTIFICATION.md > SHA256SUMS
          sha256sum -c SHA256SUMS

      - name: "Unggah Seluruh Artefak Terverifikasi & Hasil Sertifikasi CI"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: nusantara-os-phase50-certified-artifacts
          path: |
            artifacts/phase50/kernel.elf
            artifacts/phase50/user.elf
            artifacts/phase50/user-test.elf
            artifacts/phase50/user-fault-test.elf
            artifacts/phase50/nusantara-os.iso
            artifacts/phase50/nusantara-phase50.iso
            artifacts/phase50/boot.log
            artifacts/phase50/qemu.log
            artifacts/phase50/serial.log
            artifacts/phase50/qemu-debug.log
            artifacts/phase50/qemu-exit-code.txt
            artifacts/phase50/elf-validation.txt
            artifacts/phase50/isolation-test-report.txt
            artifacts/phase50/toolchain-versions.txt
            artifacts/phase50/test-report.txt
            artifacts/phase50/test-results.txt
            artifacts/phase50/SHA256SUMS
            artifacts/phase50/FINAL-CERTIFICATION.md
          retention-days: 14
