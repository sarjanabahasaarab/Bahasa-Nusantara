name: NUSANTARA OS priority inheritance contract — Phase 128
on:
  pull_request:
    paths:
      - 'src/runtime/os/scheduler/scheduler.*'
      - 'src/runtime/os/scheduler/priority-inheritance.*'
      - 'src/runtime/os/scheduler/sync.*'
      - 'src/runtime/os/scheduler/wait-queue.*'
      - 'pengujian/os/uji_priority_inheritance_fase128.c'
      - '.github/workflows/os-priority-inheritance-phase128.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  priority-inheritance-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict C11 priority inheritance contract
        run: cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/runtime/os/scheduler src/runtime/os/scheduler/scheduler.c src/runtime/os/scheduler/wait-queue.c src/runtime/os/scheduler/sync.c src/runtime/os/scheduler/priority-inheritance.c pengujian/os/uji_priority_inheritance_fase128.c -o /tmp/uji-priority-inheritance
      - name: Run priority inheritance contract
        run: /tmp/uji-priority-inheritance
