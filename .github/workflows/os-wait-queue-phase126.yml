name: NUSANTARA OS wait queue contract — Phase 126
on:
  pull_request:
    paths:
      - 'src/runtime/os/scheduler/wait-queue.*'
      - 'src/runtime/os/scheduler/scheduler.*'
      - 'pengujian/os/uji_wait_queue_fase126.c'
      - '.github/workflows/os-wait-queue-phase126.yml'
      - 'docs/os/PHASE-126-WAIT-QUEUES.md'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  wait-queue-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict C11 wait queue contract
        run: |
          cc -std=c11 -Wall -Wextra -Werror -pedantic -Isrc/runtime/os/scheduler src/runtime/os/scheduler/scheduler.c src/runtime/os/scheduler/wait-queue.c pengujian/os/uji_wait_queue_fase126.c -o /tmp/uji-wait-queue
      - name: Run wait queue contract
        run: /tmp/uji-wait-queue
