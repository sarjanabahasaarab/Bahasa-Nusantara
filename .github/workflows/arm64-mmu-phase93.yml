name: "NUSANTARA OS — ARM64 MMU (Phase 93)"

on:
  push:
    branches: ["phase93-arm64-mmu-tables"]
    paths:
      - "src/runtime/os/arch/arm64/mmu.ts"
      - "pengujian/os/uji_arm64_mmu_fase93.ts"
      - ".github/workflows/arm64-mmu-phase93.yml"
      - "docs/os/arm64/PHASE-93-MMU.md"
  pull_request:
    branches: ["phase91-arm64-port-framework"]
    paths:
      - "src/runtime/os/arch/arm64/mmu.ts"
      - "pengujian/os/uji_arm64_mmu_fase93.ts"
      - "docs/os/arm64/PHASE-93-MMU.md"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: arm64-mmu-phase93-${{ github.ref }}
  cancel-in-progress: true

jobs:
  mmu-contract:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: TypeScript typecheck
        run: npm run lint
      - name: Test ARM64 MMU descriptors and sparse table plan
        run: npx tsx pengujian/os/uji_arm64_mmu_fase93.ts
