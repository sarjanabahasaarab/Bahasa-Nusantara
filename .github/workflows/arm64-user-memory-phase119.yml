name: ARM64 EL0 memory validation — Phase 119
on:
  pull_request:
    paths:
      - 'src/runtime/os/arch/arm64/user-memory.*'
      - 'src/runtime/os/arch/arm64/address-space.*'
      - 'src/runtime/os/arch/arm64/mmu.*'
      - 'pengujian/os/uji_arm64_user_memory_fase119.c'
      - '.github/workflows/arm64-user-memory-phase119.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Compile strict EL0 memory validation test
        run: |
          cc -std=c11 -O2 -Wall -Wextra -Werror -pedantic \
            -Isrc/runtime/os/arch/arm64 \
            src/runtime/os/arch/arm64/mmu.c \
            src/runtime/os/arch/arm64/address-space.c \
            src/runtime/os/arch/arm64/user-memory.c \
            pengujian/os/uji_arm64_user_memory_fase119.c \
            -o /tmp/nusantara-phase119-user-memory
      - name: Run permission and boundary tests
        run: /tmp/nusantara-phase119-user-memory
