name: NusantaraMobile
options:
  deploymentTarget:
    iOS: '15.0'
settings:
  base:
    SWIFT_VERSION: '5.0'
    CODE_SIGNING_ALLOWED: 'NO'
targets:
  NusantaraMobile:
    type: application
    platform: iOS
    sources:
      - path: NusantaraMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.nusantara.mobile
        PRODUCT_NAME: NUSANTARA
        PRODUCT_MODULE_NAME: NusantaraMobile
        INFOPLIST_KEY_CFBundleDisplayName: NUSANTARA
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        GENERATE_INFOPLIST_FILE: YES
        TARGETED_DEVICE_FAMILY: '1,2'

  NusantaraMobileTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: NusantaraMobileTests
    dependencies:
      - target: NusantaraMobile
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: id.nusantara.mobile.tests
        GENERATE_INFOPLIST_FILE: YES

schemes:
  NusantaraMobile:
    build:
      targets:
        NusantaraMobile: all
        NusantaraMobileTests: [test]
    test:
      targets:
        - NusantaraMobileTests
